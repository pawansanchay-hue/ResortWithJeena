<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Panel - Jeena Resort &amp; Spa</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body class="admin-body">

  <!-- ======================================================= login gate -->
  <div class="gate" id="gate" hidden>
    <form class="gate-card" id="gateForm" novalidate>
      <img src="/assets/logo.svg" alt="Jeena Resort &amp; Spa" class="gate-logo">
      <h1>Admin Panel</h1>
      <p class="gate-sub">Sign in with an administrator account to manage the resort.</p>

      <div class="field">
        <label for="gateEmail">Email</label>
        <input type="email" id="gateEmail" autocomplete="username" required placeholder="admin@resortwithjeena.com">
      </div>
      <div class="field">
        <label for="gatePassword">Password</label>
        <div class="input-group">
          <input type="password" id="gatePassword" autocomplete="current-password" required placeholder="Your password">
          <button class="input-group-btn" type="button" id="gateEye" aria-label="Show password">&#128065;</button>
        </div>
      </div>
      <div id="gateAlert"></div>
      <button class="btn btn-block btn-lg" type="submit" id="gateBtn">Sign in</button>
      <p class="gate-help" id="gateHelp"></p>
      <a class="gate-back" href="/index.html">&larr; Back to the website</a>
    </form>
  </div>

  <!-- ====================================================== admin shell -->
  <div class="shell" id="shell" hidden>
    <aside class="side" id="side">
      <div class="side-brand">
        <img src="/assets/logo-light.svg" alt="">
        <div>
          <strong>Jeena</strong>
          <span>Control panel</span>
        </div>
      </div>

      <nav class="side-nav" id="sideNav"></nav>

      <div class="side-foot">
        <div class="side-user">
          <span class="side-avatar" id="sideAvatar"></span>
          <div>
            <strong id="sideName"></strong>
            <span id="sideRole"></span>
          </div>
        </div>
        <div class="side-actions">
          <a href="/index.html" target="_blank" rel="noopener">View site</a>
          <button type="button" id="sideLogout">Sign out</button>
        </div>
      </div>
    </aside>

    <div class="main" id="main">
      <header class="main-head">
        <button class="main-burger" id="mainBurger" aria-label="Toggle menu"><span></span><span></span><span></span></button>
        <div class="main-title">
          <h1 id="viewTitle">Dashboard</h1>
          <p id="viewSub"></p>
        </div>
        <div class="main-tools">
          <span class="pill" id="pillSmtp"></span>
          <a class="btn btn-sm btn-outline" href="/index.html" target="_blank" rel="noopener">Open website</a>
          <button class="btn btn-sm btn-dark" type="button" id="quickAdd">Quick add</button>
        </div>
      </header>

      <div class="main-body" id="view">
        <div class="admin-spinner"></div>
      </div>
    </div>
  </div>

  <div id="adminToasts" class="toast-stack"></div>

  <div class="modal-back" id="adminModal">
    <div class="modal" id="adminModalBox"></div>
  </div>

  <script type="module" src="/admin/js/admin.js"></script></body>
</html>

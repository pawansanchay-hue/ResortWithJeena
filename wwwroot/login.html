<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In</title>
  <meta name="description" content="Sign in to manage your reservations, food orders and profile at Jeena Resort & Spa.">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="topbar"></div>
  <header id="siteHeader"></header>

  <main>
    <section class="auth-wrap">
      <div class="auth-card" data-anim="up">
        <div class="auth-head">
          <span class="eyebrow sym">Welcome back</span>
          <h1>Sign in to your account</h1>
          <p class="muted">Manage bookings, order food and keep your details up to date.</p>
        </div>

        <div class="tabs" id="authTabs">
          <button class="tab-btn active" type="button" data-tab="signin">Sign in</button>
          <button class="tab-btn" type="button" data-tab="forgot">Forgot password</button>
        </div>

        <!-- sign in -->
        <div data-tab-panel="signin">
          <form class="form" id="signinForm" novalidate>
            <div class="field">
              <label for="liEmail">Email address</label>
              <input type="email" id="liEmail" autocomplete="email" required placeholder="you@example.com">
            </div>
            <div class="field">
              <label for="liPassword">Password</label>
              <div class="input-group">
                <input type="password" id="liPassword" autocomplete="current-password" required placeholder="Your password">
                <button class="input-group-btn" type="button" id="togglePw" aria-label="Show password">&#128065;</button>
              </div>
            </div>
            <div class="flex items-center justify-between flex-wrap">
              <label class="checkline" for="liRemember">
                <input type="checkbox" id="liRemember" checked>
                <span>Keep me signed in</span>
              </label>
              <button class="btn-link" type="button" data-goto="forgot">Forgot password?</button>
            </div>
            <div id="signinAlert"></div>
            <button class="btn btn-lg btn-block" type="submit" id="signinBtn">Sign in</button>
          </form>
        </div>

        <!-- forgot password -->
        <div data-tab-panel="forgot" hidden>
          <form class="form" id="forgotForm" novalidate>
            <div class="field">
              <label for="fpEmail">Your email address</label>
              <input type="email" id="fpEmail" required placeholder="you@example.com">
            </div>
            <div id="forgotAlert"></div>
            <button class="btn btn-block" type="submit" id="forgotBtn">Send reset code</button>
          </form>

          <form class="form" id="resetForm" hidden novalidate>
            <div class="field">
              <label for="rpCode">Reset code</label>
              <input id="rpCode" inputmode="numeric" autocomplete="one-time-code" required placeholder="6 digit code">
            </div>
            <div class="field">
              <label for="rpPassword">New password</label>
              <input type="password" id="rpPassword" required placeholder="At least 6 characters">
            </div>
            <div id="resetAlert"></div>
            <button class="btn btn-block" type="submit" id="resetBtn">Set new password</button>
          </form>
        </div>

        <p class="auth-foot">
          New here? <a href="/register.html">Create an account</a>
          <span class="muted">&middot;</span>
          <a href="/index.html">Back to the resort</a>
        </p>
      </div>
    </section>
  </main>

  <footer id="siteFooter"></footer>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
